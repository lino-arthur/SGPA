
<!DOCTYPE html>
{% load static %}
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SGPA - Gestão Animal{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<div class="app-container">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <span class="brand-icon">🐾</span>
            <h2>SGPA</h2>
            <small>Gestão de Proteção Animal</small>
        </div>

        <nav class="sidebar-menu" aria-label="Menu principal">

            <a href="{% url 'dashboard' %}" class="menu-item">
                <span aria-hidden="true">▦</span> Dashboard
            </a>

            <a href="{% url 'lista_animais' %}" class="menu-item">
                <span aria-hidden="true">🐾</span> Animais
            </a>

            <a href="{% url 'lista_historicos' %}" class="menu-item">
                <span aria-hidden="true">🩺</span> Histórico Veterinário
            </a>

            <a href="{% url 'lista_adocoes' %}" class="menu-item">
                <span aria-hidden="true">♡</span> Adoções
            </a>

        </nav>

        <div class="sidebar-footer">
            Sistema de Gestão Animal
        </div>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h5>SGPA</h5>
                <small>Sistema de Gestão de Proteção Animal</small>
            </div>

            <div class="topbar-actions">
                <button
                    type="button"
                    id="contrast-toggle"
                    class="contrast-button"
                    aria-pressed="false"
                    aria-label="Ativar modo de alto contraste">
                    ◐ Alto contraste
                </button>

                <div class="user-info">
                    Administração
                </div>
            </div>
        </header>

        <section class="page-content">
            {% block content %}
            {% endblock %}
        </section>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/main.js' %}"></script>

</body>
</html>
